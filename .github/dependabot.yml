version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
      - "/.github/workflows"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # timers.ts needs the version that Vitest bundles, which package.json
      # pins: a change of Vitest's packages moves it, by hand
      - dependency-name: "@sinonjs/fake-timers"
    groups:
      # oxlint requires a version of oxlint-tsgolint, and oxfmt and oxc-parser
      # are released with it
      "oxc":
        patterns:
          - "oxc-parser"
          - "oxfmt"
          - "oxlint"
          - "oxlint-tsgolint"
      # snovader/tooling's configurations, which a change of formatting or of
      # rules can need in step
      "snovader":
        patterns:
          - "@snovader/*"
      # @vitest/expect and @vitest/snapshot require their own version of
      # @vitest/spy and @vitest/utils, which the runner imports too, and a
      # range of tinyrainbow: expect.ts turns off the colours of the copy that
      # @vitest/expect loads, so the package's tinyrainbow and theirs have to
      # resolve to one copy
      "vitest":
        patterns:
          - "@vitest/*"
          - "tinyrainbow"
